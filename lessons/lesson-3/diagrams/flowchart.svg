<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 3 — Why a slow consumer causes a rebalance storm</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="40" y="120" width="210" height="56" rx="28.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="145.0" y="153.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">poll() returns 100 records</text><rect x="40" y="220" width="210" height="56" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="145.0" y="253.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">100 x 100 ms = 10 s work</text><polygon points="435.0,210 550,248.0 435.0,286 320,248.0" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="435.0" y="244.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">10 s &gt; max.poll.interval.ms</text><text x="435.0" y="262.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">(5 s)?</text><rect x="620" y="120" width="290" height="56" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="765.0" y="144.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Broker evicts the member</text><text x="765.0" y="162.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">partitions move away</text><rect x="620" y="220" width="290" height="56" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="765.0" y="244.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Commit fails; batch is</text><text x="765.0" y="262.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">re-read by someone else</text><rect x="620" y="320" width="290" height="56" rx="4" fill="#fff" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="765.0" y="344.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Member rejoins -&gt; another</text><text x="765.0" y="362.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">rebalance -&gt; repeat</text><rect x="320" y="340" width="230" height="50" rx="25.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="435.0" y="361.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Fix: max.poll.records=10</text><text x="435.0" y="379.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">1 s per batch</text><path d="M145.0,176.0 L145.0,220.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M250.0,248.0 L320.0,248.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M495.0,229.8 L672.6,176.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="568.9" y="190.9" width="29.8" height="16" fill="#fff" opacity="0.92"/><text x="583.8" y="202.9" font-size="12" fill="#71717a" text-anchor="middle">yes</text><path d="M765.0,176.0 L765.0,220.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M765.0,276.0 L765.0,320.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M435.0,286.0 L435.0,340.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="423.4" y="301.0" width="23.2" height="16" fill="#fff" opacity="0.92"/><text x="435.0" y="313.0" font-size="12" fill="#71717a" text-anchor="middle">no</text></svg>