<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 1 — Life of one OrderPlaced event</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="40" y="120" width="240" height="64" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="160.0" y="148.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">POST /orders</text><text x="160.0" y="166.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">JSON body</text><rect x="340" y="120" width="240" height="64" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="460.0" y="148.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Serialize</text><text x="460.0" y="166.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">OrderPlaced -&gt; JSON</text><rect x="640" y="120" width="240" height="64" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="760.0" y="148.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Partition</text><text x="760.0" y="166.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">hash(orderId) % 3</text><rect x="40" y="300" width="240" height="64" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="160.0" y="328.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Broker appends</text><text x="160.0" y="346.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">returns offset (ack)</text><rect x="340" y="300" width="240" height="64" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="460.0" y="328.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Consumer polls</text><text x="460.0" y="346.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">batch of records</text><rect x="640" y="300" width="240" height="64" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="760.0" y="328.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Handle + commit</text><text x="760.0" y="346.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">offset moves forward</text><path d="M280.0,152.0 L340.0,152.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M580.0,152.0 L640.0,152.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M653.3,184.0 L266.7,300.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M280.0,332.0 L340.0,332.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M580.0,332.0 L640.0,332.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><text x="40" y="450" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">The HTTP response waits for step 4, so the customer only hears "placed" once Kafka has stored the event.</text></svg>