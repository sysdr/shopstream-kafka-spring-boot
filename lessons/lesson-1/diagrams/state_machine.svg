<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 1 — The consumer stops, the events wait</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="60" y="200" width="180" height="60" rx="30.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="150.0" y="226.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">running</text><text x="150.0" y="244.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">lag 0</text><rect x="380" y="200" width="180" height="60" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="470.0" y="226.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">stopped</text><text x="470.0" y="244.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">lag grows</text><rect x="700" y="200" width="180" height="60" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="790.0" y="226.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">catching up</text><text x="790.0" y="244.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="m