<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 4 — Leader failover for one partition</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="60" y="200" width="180" height="60" rx="30.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="150.0" y="226.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">leader on broker 1</text><text x="150.0" y="244.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">ISR {1,2,3}</text><rect x="330" y="200" width="180" height="60" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="420.0" y="235.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">broker 1 killed</text><rect x="600" y="200" width="180" height="60" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="690.0" y="226.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">new leader from ISR</text><text x="690.0" y="244.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">ISR {2,3}</text><rect x="600" y="340" width="180" height="60" rx="30.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="690.0" y="366.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">broker 1 back</text><text x="690.0" y="384.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">catches up -&gt; ISR {1,2,3}</text><path d="M240.0,230.0 L330.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M510.0,230.0 L600.0,230.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="493.9" y="218.0" width="122.2" height="16" fill="#fff" opacity="0.92"/><text x="555.0" y="230.0" font-size="12" fill="#71717a" text-anchor="middle">controller elects</text><path d="M690.0,260.0 L690.0,340.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="661.9" y="288.0" width="56.2" height="16" fill="#fff" opacity="0.92"/><text x="690.0" y="300.0" font-size="12" fill="#71717a" text-anchor="middle">restart</text><text x="60" y="460" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">With min.insync.replicas=2, writes keep working with one broker down and stop (safely) with two down.</text></svg>