<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 4 — When is a write acknowledged?</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="40" y="110" width="200" height="56" rx="28.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="140.0" y="143.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">send(order)</text><polygon points="140.0,210 240,248.0 140.0,286 40,248.0" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="140.0" y="253.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">acks = 1?</text><rect x="300" y="110" width="270" height="56" rx="4" fill="#fff" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="435.0" y="134.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Leader wrote it -&gt; ack</text><text x="435.0" y="152.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">followers may not have it</text><rect x="300" y="220" width="270" height="56" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="435.0" y="244.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Wait for all in-sync replicas</text><text x="435.0" y="262.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">(at least 2)</text><rect x="640" y="220" width="270" height="56" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="775.0" y="253.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Ack lost / timeout -&gt; retry</text><rect x="640" y="330" width="270" height="56" rx="28.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="775.0" y="354.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Idempotent? broker drops the</text><text x="775.0" y="372.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">retry by (producerId, seq)</text><rect x="300" y="330" width="270" height="56" rx="4" fill="#fff" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="435.0" y="354.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Not idempotent: the retry</text><text x="435.0" y="372.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">is a second copy</text><path d="M140.0,166.0 L140.0,210.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M190.5,229.2 L359.9,166.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="260.3" y="185.6" width="29.8" height="16" fill="#fff" opacity="0.92"/><text x="275.2" y="197.6" font-size="12" fill="#71717a" text-anchor="middle">yes</text><path d="M240.0,248.0 L300.0,248.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="238.6" y="236.0" width="62.8" height="16" fill="#fff" opacity="0.92"/><text x="270.0" y="248.0" font-size="12" fill="#71717a" text-anchor="middle">no (all)</text><path d="M570.0,248.0 L640.0,248.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M775.0,276.0 L775.0,330.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M688.5,276.0 L521.5,330.0" fill="none" stroke="#18181b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ak)"/></svg>