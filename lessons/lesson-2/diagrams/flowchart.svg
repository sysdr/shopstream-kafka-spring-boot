<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 2 — How the producer picks a partition</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="40" y="110" width="220" height="56" rx="28.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="150.0" y="143.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Event with key</text><polygon points="150.0,210 260,248.0 150.0,286 40,248.0" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="150.0" y="253.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Key is null?</text><rect x="340" y="210" width="260" height="76" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="470.0" y="253.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">murmur2(key) % partitions</text><rect x="680" y="220" width="230" height="56" rx="28.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="795.0" y="244.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Same key -&gt;</text><text x="795.0" y="262.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">same partition, in order</text><rect x="40" y="340" width="220" height="56" rx="4" fill="#fff" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="150.0" y="364.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Sticky batch</text><text x="150.0" y="382.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">any partition</text><path d="M150.0,166.0 L150.0,210.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M260.0,248.0 L340.0,248.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="288.4" y="236.0" width="23.2" height="16" fill="#fff" opacity="0.92"/><text x="300.0" y="248.0" font-size="12" fill="#71717a" text-anchor="middle">no</text><path d="M600.0,248.0 L680.0,248.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M150.0,286.0 L150.0,340.0" fill="none" stroke="#18181b" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ak)"/><rect x="135.1" y="301.0" width="29.8" height="16" fill="#fff" opacity="0.92"/><text x="150.0" y="313.0" font-size="12" fill="#71717a" text-anchor="middle">yes</text><text x="340" y="330" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">A key that changes per event (eventId) behaves like</text><text x="340" y="348" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">random placement: the order's history is scattered.</text></svg>