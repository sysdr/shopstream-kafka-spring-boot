<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 5 — The transactional outbox</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><text x="32" y="82" font-size="14" fill="#71717a">The order and its event are written in ONE database transaction; a relay publishes the event afterwards</text><rect x="30" y="200" width="140" height="64" rx="32.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="100.0" y="228.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">POST</text><text x="100.0" y="246.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">/orders/batch</text><rect x="210" y="180" width="190" height="104" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="305.0" y="219.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">order-service</text><text x="305.0" y="237.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">one transaction:</text><text x="305.0" y="255.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">INSERT orders + outbox</text><path d="M450,170 v124 a85.0,10 0 0 0 170,0 v-124" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><ellipse cx="535.0" cy="170" rx="85.0" ry="10" fill="#fafafa" stroke="#18181b" stroke-width="1.5"/><text x="535.0" y="216.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">H2 database</text><text x="535.0" y="234.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">orders</text><text x="535.0" y="252.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">outbox</text><text x="535.0" y="270.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">(published_at)</text><rect x="450" y="360" width="170" height="64" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="535.0" y="388.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">OutboxRelay</text><text x="535.0" y="406.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">every 100 ms</text><rect x="690" y="190" width="120" height="84" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="750.0" y="228.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Kafka</text><text x="750.0" y="246.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">orders</text><rect x="840" y="190" width="100" height="84" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="890.0" y="219.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">fulfill-</text><text x="890.0" y="237.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">ment</text><text x="890.0" y="255.0" font-size="12.5" font-weight="400" fill="#71717a" text-anchor="middle">dedup</text><path d="M170.0,232.0 L210.0,232.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M400.0,232.0 L450.0,232.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><path d="M535.0,304.0 L535.0,360.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="477.2" y="320.0" width="115.6" height="16" fill="#fff" opacity="0.92"/><text x="535.0" y="332.0" font-size="12" fill="#71717a" text-anchor="middle">unpublished rows</text><path d="M620.0,392.0 L750.0,392.0 L750.0,274.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><rect x="630.5" y="380.0" width="109.0" height="16" fill="#fff" opacity="0.92"/><text x="685.0" y="392.0" font-size="12" fill="#71717a" text-anchor="middle">send, then mark</text><path d="M810.0,232.0 L840.0,232.0" fill="none" stroke="#18181b" stroke-width="1.6" marker-end="url(#ak)"/><text x="40" y="470" font-size="14" font-weight="700" fill="#71717a" text-anchor="start">3 crashes each: dual write left 3 orders saved but never announced; outbox left 0.</text><text x="40" y="494" font-size="14" font-weight="400" fill="#71717a" text-anchor="start">The outbox re-sent 3 rows after crashes; the consumer de-duplicated them by order id.</text></svg>