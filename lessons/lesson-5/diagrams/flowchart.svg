<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" role="img"><defs><marker id="ak" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#18181b"/></marker><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#dc2626"/></marker><marker id="sk" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#18181b"/></marker><marker id="sr" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#dc2626"/></marker></defs><rect x="0" y="0" width="960" height="540" fill="#ffffff"/><text x="32" y="44" font-size="22" font-weight="700" fill="#18181b">Day 5 — Where a crash hurts</text><rect x="32" y="54" width="48" height="4" fill="#dc2626"/><rect x="40" y="110" width="240" height="56" rx="28.0" fill="#f4f4f5" stroke="#18181b" stroke-width="1.5"/><text x="160.0" y="143.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">Dual write</text><rect x="40" y="200" width="240" height="56" rx="4" fill="#fff" stroke="#18181b" stroke-width="1.5"/><text x="160.0" y="233.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">COMMIT order</text><rect x="40" y="290" width="240" height="56" rx="4" fill="#fef2f2" stroke="#dc2626" stroke-width="1.5"/><text x="160.0" y="323.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">CRASH</text><rect x="40" y="380" width="240" height="56" rx="4" fill="#fff" stroke="#d4d4d8" stroke-width="1.5" stroke-dasharray="5 4"/><text x="160.0" y="413.0" font-size="15" font-weight="700" fill="#18181b" text-anchor="middle">publish never happens</text><path d="M160.0,166.0 L160.0,200.0" fill="none" stroke="#18181b" stroke-width="1.